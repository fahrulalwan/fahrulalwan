# Security scanning. CLAUDE.md tells readers this repo is scanned by CodeQL, and
# until now that was not true: this file has never run once.
#
# Two independent reasons it could not. It triggered on `master`, a branch that
# does not exist here — the default is `main` — so neither the push nor the
# pull_request trigger could ever fire, leaving only the weekly cron. And it
# pinned github/codeql-action@v1, retired in January 2023, which hard-fails on
# start, so the cron could not have produced a passing run either.
#
# Structure below follows GitHub's current starter template (actions/starter-workflows,
# code-scanning/codeql.yml) rather than being hand-written: v4 of the action,
# `javascript-typescript` as one language rather than `javascript`, `build-mode: none`
# because an interpreted language needs no build, and the explicit permissions block
# that v4 requires to upload results.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Saturday 06:17 UTC. Kept from the original file: an odd minute avoids the
    # top-of-hour rush on shared runners, and a weekly sweep catches advisories
    # published against dependencies that have not changed.
    - cron: '17 6 * * 6'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
